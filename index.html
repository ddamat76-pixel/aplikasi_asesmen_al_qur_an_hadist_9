        function StudentDashboard({ user, setView, setExamData }) {

        function useTimer(initialSeconds, onComplete) {
            const [secondsLeft, setSecondsLeft] = useState(initialSeconds);

            useEffect(() => {
                if (secondsLeft <= 0) {
                    onComplete();
                    return;
                }
                const interval = setInterval(() => {
                    setSecondsLeft(prev => prev - 1);
                }, 1000);
                return () => clearInterval(interval);
            }, [secondsLeft, onComplete]);

            const formatTime = () => {
                const h = Math.floor(secondsLeft / 3600);
                const m = Math.floor((secondsLeft % 3600) / 60);
                const s = secondsLeft % 60;
                return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return { secondsLeft, formatTime };
        }

        function ExamInterface({ user, questions, setView, setExamData, examData, isPreview = false }) {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [localAnswers, setLocalAnswers] = useState(examData?.answers || {});
            const [showConfirmSubmit, setShowConfirmSubmit] = useState(false);

            const handleTimeUp = useCallback(() => {
                if(!examData.isFinished) {
                   submitExam(true);
                }
            }, [localAnswers]);

            const { secondsLeft, formatTime } = useTimer(examData?.timeLimit || 5400, handleTimeUp);

            const handleAnswerChange = (qId, value, type) => {
                const newAnswers = { ...localAnswers };
                
                if (type === 'pg') {
                    newAnswers[qId] = value;
                } else if (type === 'pg_kompleks') {
                    const currentArr = newAnswers[qId] || [];
                    if (currentArr.includes(value)) {
                        newAnswers[qId] = currentArr.filter(v => v !== value);
                    } else {
                        newAnswers[qId] = [...currentArr, value];
                    }
                } else if (type === 'menjodohkan') {
                    const currentMatches = newAnswers[qId] || [];
                    const filteredMatches = currentMatches.filter(m => m.left !== value.left);
                    newAnswers[qId] = [...filteredMatches, value];
                }
                
                setLocalAnswers(newAnswers);
                setExamData({ ...examData, answers: newAnswers });
            };

            const submitExam = (autoSubmit = false) => {
                let score = 0;
                let correctCount = 0;
                const maxScore = 100;
                const totalQuestions = questions.length;
                const weightPerQuestion = maxScore / totalQuestions; // 100 / 40 = 2.5

                questions.forEach(q => {
                    const ans = localAnswers[q.id];
                    if (!ans) return;

                    if (q.type === 'pg' && ans === q.answer) {
                        correctCount++;
                        score += weightPerQuestion;
                    } else if (q.type === 'pg_kompleks') {
                        const correctAnswers = q.answers;
                        if (ans.length === correctAnswers.length && ans.every(a => correctAnswers.includes(a))) {
                            correctCount++;
                            score += weightPerQuestion;
                        } else if (ans.length > 0) {
                            const correctMatches = ans.filter(a => correctAnswers.includes(a)).length;
                            const incorrectMatches = ans.length - correctMatches;
                            if(incorrectMatches === 0) {
                                score += (weightPerQuestion * (correctMatches / correctAnswers.length));
                            }
                        }
                    } else if (q.type === 'menjodohkan') {
                        let matchCorrect = 0;
                        const totalPairs = q.pairs.length;
                        ans.forEach(match => {
                            const correctPair = q.pairs.find(p => p.left === match.left);
                            if (correctPair && correctPair.right === match.right) {
                                matchCorrect++;
                            }
                        });
                        score += (weightPerQuestion * (matchCorrect / totalPairs));
                        if(matchCorrect === totalPairs) correctCount++;
                    }
                });

                const finalScore = Math.round(score);

                if (!isPreview) {
                    const usersData = JSON.parse(localStorage.getItem('alquranExamUsers') || '{}');
                    const userKey = `${user.kelas}_${user.presensi}_${user.name.trim().toLowerCase()}`;
                    if (usersData[userKey]) {
                        usersData[userKey].attempts += 1;
                        usersData[userKey].scores.push({
                            score: finalScore,
                            date: new Date().toISOString(),
                            answers: localAnswers
                        });
                        localStorage.setItem('alquranExamUsers', JSON.stringify(usersData));
                    }
                }

                setExamData({
                    ...examData,
                    answers: localAnswers,
                    score: finalScore,
                    isFinished: true,
                    timeSpent: (90 * 60) - secondsLeft
                });
                setView('result');
            };

            const q = questions[currentQIndex];

            const navButtons = questions.map((q, idx) => {
                let status = 'unanswered';
                const ans = localAnswers[q.id];
                if (ans) {
                    if (q.type === 'pg') status = 'answered';
                    else if (q.type === 'pg_kompleks' && ans.length > 0) status = 'answered';
                    else if (q.type === 'menjodohkan' && ans.length === q.pairs.length) status = 'answered';
                    else if (q.type === 'menjodohkan' && ans.length > 0) status = 'partial';
                }
                return (
                    <button key={q.id} onClick={() => setCurrentQIndex(idx)}
                        className={`w-9 h-9 rounded text-xs font-semibold border flex items-center justify-center transition
                            ${currentQIndex === idx ? 'ring-2 ring-emerald-600 ring-offset-1' : ''}
                            ${status === 'answered' ? 'bg-emerald-700 text-white border-emerald-800' : 
                              status === 'partial' ? 'bg-amber-400 text-slate-900 border-amber-500' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}
                    >
                        {idx + 1}
                    </button>
                );
            });

            return (
                <div className="flex flex-col md:flex-row gap-6">
                    <div className="flex-1">
                        <div className="bg-white rounded-xl shadow mb-4 p-4 flex justify-between items-center sticky top-0 z-20 border border-slate-200">
                            <div>
                                <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    Soal {currentQIndex + 1} dari {questions.length}
                                </span>
                                {isPreview && <span className="ml-2 bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs font-bold">MODE UJI COBA GURU</span>}
                            </div>
                            <div className={`font-mono text-base sm:text-lg font-bold flex items-center gap-2 px-4 py-1.5 rounded-lg ${secondsLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-slate-100 text-slate-800'}`}>
                                <i className="far fa-clock"></i> {formatTime()}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow p-6 min-h-[400px] border border-slate-200">
                            <div className="mb-6">
                                <h3 className="text-base sm:text-lg text-slate-900 font-medium leading-relaxed mb-3">{q.text}</h3>
                                {q.type === 'pg_kompleks' && <p className="text-xs sm:text-sm text-blue-700 bg-blue-50 p-2.5 rounded border border-blue-200 inline-block"><i className="fas fa-info-circle mr-1"></i> Pilihan ganda kompleks: Pilih semua jawaban yang benar (bisa lebih dari satu).</p>}
                                {q.type === 'menjodohkan' && <p className="text-xs sm:text-sm text-amber-700 bg-amber-50 p-2.5 rounded border border-amber-200 inline-block"><i className="fas fa-info-circle mr-1"></i> Menjodohkan: Klik item di sebelah kiri lalu klik pasangannya di sebelah kanan.</p>}
                            </div>

                            <div className="space-y-3">
                                {q.type === 'pg' && q.options.map((opt, i) => (
                                    <label key={i} className={`flex items-start p-3.5 border rounded-lg cursor-pointer transition ${localAnswers[q.id] === opt ? 'border-emerald-600 bg-emerald-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                        <input type="radio" name={`q_${q.id}`} value={opt} checked={localAnswers[q.id] === opt} onChange={() => handleAnswerChange(q.id, opt, 'pg')} className="mt-1 w-4 h-4 text-emerald-700 focus:ring-emerald-600 border-gray-300" />
                                        <span className="ml-3 text-sm sm:text-base text-slate-800">{opt}</span>
                                    </label>
                                ))}

                                {q.type === 'pg_kompleks' && q.options.map((opt, i) => (
                                    <label key={i} className={`flex items-start p-3.5 border rounded-lg cursor-pointer transition ${(localAnswers[q.id] || []).includes(opt) ? 'border-blue-600 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                        <input type="checkbox" checked={(localAnswers[q.id] || []).includes(opt)} onChange={() => handleAnswerChange(q.id, opt, 'pg_kompleks')} className="mt-1 w-4 h-4 text-blue-700 focus:ring-blue-600 rounded border-gray-300" />
                                        <span className="ml-3 text-sm sm:text-base text-slate-800">{opt}</span>
                                    </label>
                                ))}

                                {q.type === 'menjodohkan' && (
                                    <MatchingQuestion 
                                        question={q} 
                                        currentAnswers={localAnswers[q.id] || []} 
                                        onMatch={(left, right) => handleAnswerChange(q.id, {left, right}, 'menjodohkan')} 
                                    />
                                )}
                            </div>
                        </div>

                        <div className="flex justify-between items-center mt-6">
                            <button onClick={() => setCurrentQIndex(Math.max(0, currentQIndex - 1))} disabled={currentQIndex === 0} className="px-5 py-2.5 bg-slate-200 text-slate-700 rounded-lg disabled:opacity-40 hover:bg-slate-300 transition text-sm font-medium">
                                <i className="fas fa-chevron-left mr-2"></i> Sebelumnya
                            </button>
                            
                            {currentQIndex < questions.length - 1 ? (
                                <button onClick={() => setCurrentQIndex(currentQIndex + 1)} className="px-5 py-2.5 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition text-sm font-medium">
                                    Selanjutnya <i className="fas fa-chevron-right ml-2"></i>
                                </button>
                            ) : (
                                <button onClick={() => setShowConfirmSubmit(true)} className="px-6 py-2.5 bg-emerald-700 text-white font-bold rounded-lg hover:bg-emerald-800 transition shadow text-sm">
                                    Selesai & Kumpulkan
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="w-full md:w-80 flex-shrink-0">
                        <div className="bg-white rounded-xl shadow p-4 sticky top-4 border border-slate-200">
                            <h4 className="font-semibold text-slate-800 mb-3 border-b pb-2">Navigasi Soal (1 - 40)</h4>
                            <div className="grid grid-cols-5 gap-2 max-h-[55vh] overflow-y-auto pr-1">
                                {navButtons}
                            </div>
                            
                            <div className="mt-5 pt-4 border-t space-y-2 text-xs text-slate-600">
                                <div className="flex items-center gap-2"><div className="w-3.5 h-3.5 bg-emerald-700 rounded"></div> Sudah dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-3.5 h-3.5 bg-amber-400 rounded"></div> Dijawab sebagian</div>
                                <div className="flex items-center gap-2"><div className="w-3.5 h-3.5 bg-white border border-slate-300 rounded"></div> Belum dijawab</div>
                            </div>

                            <button onClick={() => setShowConfirmSubmit(true)} className="w-full mt-5 px-4 py-2.5 bg-emerald-100 text-emerald-900 border border-emerald-300 font-semibold rounded-lg hover:bg-emerald-200 transition text-sm">
                                Akhiri & Kumpulkan Ujian
                            </button>
                        </div>
                    </div>

                    {showConfirmSubmit && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-3 text-slate-900">Konfirmasi Pengumpulan</h3>
                                <p className="mb-6 text-slate-600 text-sm">Apakah Anda yakin ingin mengakhiri dan mengumpulkan ujian? Waktu tersisa: <strong>{formatTime()}</strong>.</p>
                                <div className="flex gap-3 justify-end">
                                    <button onClick={() => setShowConfirmSubmit(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded transition text-sm font-medium">Batal</button>
                                    <button onClick={() => submitExam(false)} className="px-5 py-2 bg-emerald-700 text-white font-bold rounded hover:bg-emerald-800 transition text-sm shadow">Ya, Kumpulkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MatchingQuestion({ question, currentAnswers, onMatch }) {
            const [selectedLeft, setSelectedLeft] = useState(null);
            const [rightOptions, setRightOptions] = useState([]);
            
            useEffect(() => {
                const rights = question.pairs.map(p => p.right);
                for (let i = rights.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rights[i], rights[j]] = [rights[j], rights[i]];
                }
                setRightOptions(rights);
            }, [question]);

            const handleLeftClick = (text) => {
                if (selectedLeft === text) setSelectedLeft(null);
                else setSelectedLeft(text);
            };

            const handleRightClick = (rightText) => {
                if (!selectedLeft) return;
                onMatch(selectedLeft, rightText);
                setSelectedLeft(null);
            };

            return (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 relative select-none">
                    <div className="space-y-3">
                        <h4 className="font-semibold text-slate-700 text-center text-sm mb-1">Pernyataan</h4>
                        {question.pairs.map((pair, idx) => {
                            const isSelected = selectedLeft === pair.left;
                            const currentMatch = currentAnswers.find(a => a.left === pair.left);
                            const hasMatch = !!currentMatch;
                            
                            return (
                                <div key={`l-${idx}`} 
                                    onClick={() => handleLeftClick(pair.left)}
                                    className={`match-item p-3 rounded-lg border-2 flex justify-between items-center bg-white z-10 relative text-xs sm:text-sm
                                        ${isSelected ? 'selected border-emerald-700 shadow-md ring-2 ring-emerald-200' : 'border-slate-300 hover:border-slate-400'}
                                        ${hasMatch && !isSelected ? 'border-blue-400 bg-blue-50' : ''}`
                                    }>
                                    <span>{pair.left}</span>
                                    {hasMatch && <span className="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full"><i className="fas fa-link"></i> Terhubung</span>}
                                </div>
                            );
                        })}
                    </div>

                    <div className="space-y-3">
                         <h4 className="font-semibold text-slate-700 text-center text-sm mb-1">Pilihan Pasangan</h4>
                        {rightOptions.map((text, idx) => {
                            const matchedBy = currentAnswers.find(a => a.right === text);
                            const isMatched = !!matchedBy;
                            const isTarget = selectedLeft !== null && !isMatched;

                            return (
                                <div key={`r-${idx}`}
                                    onClick={() => isTarget ? handleRightClick(text) : null}
                                    className={`match-item p-3 rounded-lg border-2 bg-white z-10 relative text-xs sm:text-sm text-center flex flex-col justify-center
                                        ${isMatched ? 'border-blue-400 bg-slate-100 text-slate-500 cursor-not-allowed' : 'border-slate-300'}
                                        ${isTarget ? 'hover:border-emerald-700 hover:bg-emerald-50 cursor-pointer border-dashed' : ''}
                                    `}>
                                    {text}
                                    {isMatched && <div className="text-[10px] text-blue-700 mt-1 truncate">Pasangan: {matchedBy.left}</div>}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ResultView({ examData, user, setView }) {
            const kkm = 80;
            const score = examData.score || 0;
            const isPass = score >= kkm;

            const timeMin = Math.floor(examData.timeSpent / 60);
            const timeSec = examData.timeSpent % 60;

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="max-w-3xl mx-auto mt-6">
                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border-t-8 border-emerald-700 print-only:border-0 print-only:shadow-none">
                        
                        <div className="p-8 text-center border-b">
                            <h2 className="text-xl sm:text-2xl font-bold text-slate-900 mb-1 uppercase tracking-wider">Hasil Penilaian Tengah Semester</h2>
                            <p className="text-slate-600 text-sm">Mata Pelajaran: Al-Qur'an Hadist Kelas IX</p>
                            <p className="text-xs sm:text-sm font-semibold text-emerald-800 mt-1">MTs. Mu'allimin NU Kota Malang</p>
                            <p className="text-xs text-slate-500 mt-1">Disusun oleh: Damat, S. Ag., S. Pd.</p>
                        </div>

                        <div className="p-6 sm:p-8">
                            <div className="flex flex-col md:flex-row gap-8 items-center justify-between mb-8">
                                <div className="flex-1 space-y-3 w-full">
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2 text-sm">
                                        <span className="text-slate-500 font-medium col-span-1">Nama Siswa</span>
                                        <span className="text-slate-900 font-bold col-span-2">: {user.name}</span>
                                    </div>
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2 text-sm">
                                        <span className="text-slate-500 font-medium col-span-1">Kelas / Presensi</span>
                                        <span className="text-slate-900 font-bold col-span-2">: {user.kelas} / No. {user.presensi}</span>
                                    </div>
                                    <div className="grid grid-cols-3 border-b border-slate-100 pb-2 text-sm">
                                        <span className="text-slate-500 font-medium col-span-1">Waktu Pengerjaan</span>
                                        <span className="text-slate-900 font-bold col-span-2">: {timeMin} menit {timeSec} detik</span>
                                    </div>
                                </div>
                                
                                <div className={`w-36 h-36 rounded-full border-8 flex flex-col items-center justify-center bg-slate-50 flex-shrink-0
                                    ${isPass ? 'border-emerald-600' : 'border-red-400'}`}>
                                    <span className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">Nilai Akhir</span>
                                    <span className={`text-4xl font-black ${isPass ? 'text-emerald-700' : 'text-red-500'}`}>
                                        {score}
                                    </span>
                                </div>
                            </div>

                            <div className={`p-4 rounded-lg text-center font-bold text-base mb-6 ${isPass ? 'bg-emerald-100 text-emerald-900' : 'bg-red-100 text-red-900'}`}>
                                {isPass ? (
                                    <><i className="fas fa-check-circle mr-2"></i> Mumtaz! Anda telah mencapai KKM (80).</>
                                ) : (
                                    <><i className="fas fa-times-circle mr-2"></i> Belum mencapai KKM (80). Tetap semangat belajar!</>
                                )}
                            </div>

                            <div className="bg-slate-50 p-4 rounded-lg text-xs sm:text-sm text-slate-600 border">
                                <p><strong>Keterangan:</strong> Sertifikat hasil asesmen ini sah sebagai rekapitulasi nilai ujian tengah semester berbasis digital.</p>
                                <p className="mt-1 text-xs text-slate-500 print-only:block hidden">Waktu Cetak: {new Date().toLocaleString('id-ID')}</p>
                            </div>
                        </div>

                        <div className="bg-slate-100 p-4 flex gap-4 justify-center no-print">
                            <button onClick={handlePrint} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition shadow text-sm flex items-center gap-2">
                                <i className="fas fa-print"></i> Cetak / Unduh PDF
                            </button>
                            <button onClick={() => setView('student_dashboard')} className="bg-slate-700 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-medium transition shadow text-sm">
                                Kembali ke Beranda
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ setView, user, setExamData, questions, appSettings, setAppSettings }) {
            const [usersData, setUsersData] = useState({});

            useEffect(() => {
                const storedUsers = JSON.parse(localStorage.getItem('alquranExamUsers') || '{}');
                setUsersData(storedUsers);
            }, []);

            const testAsStudent = () => {
                setExamData({
                    answers: {},
                    startTime: Date.now(),
                    timeLimit: 90 * 60,
                    isFinished: false
                });
                setView('exam');
            };

            const updateSettings = (e) => {
                e.preventDefault();
                localStorage.setItem('alquranExamSettings', JSON.stringify(appSettings));
                alert('Pengaturan admin berhasil disimpan!');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow p-6 border border-slate-200">
                        <h2 className="text-xl sm:text-2xl font-bold text-slate-900 mb-2">Panel Guru / Administrator</h2>
                        <p className="text-slate-600 text-sm mb-6">Kelola bank soal, pantau nilai siswa, uji coba asesmen, dan pengaturan keamanan.</p>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-emerald-900 text-base mb-1"><i className="fas fa-book mr-2"></i>Bank Soal</h3>
                                    <p className="text-xs text-emerald-700 mb-4">Total: {questions.length} Soal (15 PG, 15 PGK, 10 Menjodohkan)</p>
                                </div>
                                <button onClick={() => setView('admin_edit')} className="bg-emerald-700 text-white w-full py-2 rounded-lg hover:bg-emerald-800 transition font-medium text-sm">Edit Bank Soal</button>
                            </div>
                            
                            <div className="bg-purple-50 border border-purple-200 rounded-xl p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-purple-900 text-base mb-1"><i className="fas fa-laptop-code mr-2"></i>Uji Coba Soal</h3>
                                    <p className="text-xs text-purple-700 mb-4">Simulasikan pengerjaan tes layaknya siswa.</p>
                                </div>
                                <button onClick={testAsStudent} className="bg-purple-700 text-white w-full py-2 rounded-lg hover:bg-purple-800 transition font-medium text-sm">Mulai Simulasi</button>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-blue-900 text-base mb-1"><i className="fas fa-users mr-2"></i>Data Siswa</h3>
                                    <p className="text-xs text-blue-700 mb-4">{Object.keys(usersData).length} siswa telah tercatat di database.</p>
                                </div>
                                <button onClick={() => alert('Data siswa tersimpan aman di LocalStorage browser.')} className="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition font-medium text-sm">Lihat Rekap</button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow p-6 border border-slate-200">
                        <h3 className="text-base font-bold text-slate-900 mb-4 border-b pb-2">Pengaturan Administrator</h3>
                        <form onSubmit={updateSettings} className="max-w-md space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Ganti Password Admin</label>
                                <input type="text" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-600 text-sm" 
                                    value={appSettings.adminPassword} 
                                    onChange={(e) => setAppSettings({...appSettings, adminPassword: e.target.value})} />
                                <p className="text-xs text-slate-500 mt-1">Default awal: admin123</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">URL Logo Madrasah (Opsional)</label>
                                <input type="url" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-600 text-sm" 
                                    placeholder="https://example.com/logo.png"
                                    value={appSettings.logo} 
                                    onChange={(e) => setAppSettings({...appSettings, logo: e.target.value})} />
                            </div>
                            <button type="submit" className="bg-slate-800 text-white px-4 py-2.5 rounded-lg hover:bg-slate-900 transition font-medium text-sm">Simpan Pengaturan</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-xl shadow p-6 border border-slate-200">
                        <h3 className="text-base font-bold text-slate-900 mb-4 border-b pb-2">Log Pengerjaan Siswa</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-700 border-b">
                                    <tr>
                                        <th className="p-3">Nama Siswa</th>
                                        <th className="p-3">Kelas / Presensi</th>
                                        <th className="p-3 text-center">Percobaan</th>
                                        <th className="p-3 text-center">Nilai Tertinggi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.values(usersData).length === 0 ? (
                                        <tr><td colSpan="4" className="p-4 text-center text-slate-500 italic">Belum ada data pengerjaan siswa.</td></tr>
                                    ) : (
                                        Object.values(usersData).map((u, i) => (
                                            <tr key={i} className="border-b hover:bg-slate-50">
                                                <td className="p-3 font-medium">{u.name}</td>
                                                <td className="p-3">{u.kelas} / No. {u.presensi}</td>
                                                <td className="p-3 text-center">{u.attempts}</td>
                                                <td className="p-3 text-center font-bold text-emerald-700">
                                                    {u.scores && u.scores.length > 0 ? Math.max(...u.scores.map(s => s.score)) : '-'}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminEditQuestions({ questions, setQuestions, setView }) {
            const handleSaveAll = () => {
                localStorage.setItem('alquranExamQuestions', JSON.stringify(questions));
                alert('Bank soal berhasil disimpan!');
            };

            const handleResetDefault = () => {
                if(confirm("Kembalikan soal ke bank soal awal Al-Qur'an Hadist?")) {
                    setQuestions(INITIAL_QUESTIONS);
                    localStorage.removeItem('alquranExamQuestions');
                }
            };

            return (
                <div className="bg-white rounded-xl shadow p-6 border border-slate-200">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Kelola Bank Soal Al-Qur'an Hadist</h2>
                            <p className="text-slate-600 text-xs">Edit struktur JSON untuk penyesuaian soal secara fleksibel.</p>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                             <button onClick={handleResetDefault} className="px-3.5 py-2 border border-red-200 text-red-600 rounded-lg hover:bg-red-50 text-xs font-medium transition">Reset Default</button>
                            <button onClick={() => setView('admin_dashboard')} className="px-3.5 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 text-xs font-medium transition">Kembali</button>
                            <button onClick={handleSaveAll} className="px-4 py-2 bg-emerald-700 text-white rounded-lg hover:bg-emerald-800 text-xs font-medium transition shadow">Simpan Perubahan</button>
                        </div>
                    </div>

                    <div className="bg-slate-900 rounded-xl p-4 font-mono text-xs sm:text-sm text-emerald-400 overflow-auto h-[550px] w-full">
                        <textarea 
                            className="w-full h-full bg-transparent border-none outline-none resize-none"
                            value={JSON.stringify(questions, null, 2)}
                            onChange={(e) => {
                                try {
                                    setQuestions(JSON.parse(e.target.value));
                                } catch (err) {}
                            }}
                            spellCheck="false"
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
